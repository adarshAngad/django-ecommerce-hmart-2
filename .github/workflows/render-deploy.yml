# Optional: auto-redeploy Render when you push to main.
# 1) Render dashboard → your Web Service → Manual Deploy → copy "Deploy hook" URL
# 2) GitHub repo → Settings → Secrets and variables → Actions → New secret
#    Name: RENDER_DEPLOY_HOOK_URL   Value: (paste the full hook URL)
# 3) Push to main — this workflow calls the hook (empty secret = skip).

name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret — skipping (add it in GitHub → Settings → Secrets)."
            exit 0
          fi
          curl -fsS "$HOOK"
