# Core stack: Postgres + Django (Gunicorn) + Nginx reverse proxy.
# Optional observability: docker compose --profile observability up -d
#
# First run:
#   copy .env.docker.example .env.docker   (PowerShell: Copy-Item .env.docker.example .env.docker)
#   docker compose up -d --build
# Open: http://localhost:8080
#
# With metrics + dashboards:
#   docker compose --profile observability up -d --build
#   Prometheus: http://localhost:9090   Grafana: http://localhost:3001  (admin / admin)

name: ecommerce-django

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      POSTGRES_DB: ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-docker-compose-dev-only-change-me}
      DEBUG: ${DEBUG:-True}
      DOCKER: "1"
      DOCKER_BEHIND_HTTP: ${DOCKER_BEHIND_HTTP:-1}
      ENABLE_PROMETHEUS: ${ENABLE_PROMETHEUS:-1}
      DOCKER_JSON_LOGS: ${DOCKER_JSON_LOGS:-1}
      DATABASE_URL: postgres://django:django@db:5432/ecommerce
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 120s

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=12h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

volumes:
  pgdata:
  media_data:
