# Render Blueprint (IaC). Adjust service name / branch in the Render dashboard as needed.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn Annu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
