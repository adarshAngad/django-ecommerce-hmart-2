# Render Blueprint — free web + free Postgres (same region).
# New project: Dashboard → New → Blueprint → connect this repo (creates DB + web).
# https://render.com/docs/blueprint-spec

databases:
  - name: ecommerce-db
    databaseName: ecommerce
    user: ecommerce
    plan: free
    region: oregon

services:
  - type: web
    name: django-ecommerce
    runtime: python
    plan: free
    region: oregon
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn Annu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
